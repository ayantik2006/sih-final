version: '3.8'

services:
  api:
    build: .
    container_name: apix-api-service
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - DATABASE_URL=postgresql+asyncpg://apix_user:apix_secret@db:5432/apix_db
      - REDIS_URL=redis://redis:6379/0
      - API_KEYS={"mospi-nso-key-2026":"NSO_STATISTICIAN","rbi-mpd-key-2026":"RBI_ANALYST"}
      - RATE_LIMIT_PUBLIC=30
      - RATE_LIMIT_AUTH=600
    depends_on:
      - db
      - redis

  db:
    image: timescale/timescaledb:latest-pg16
    container_name: apix-timescaledb
    environment:
      - POSTGRES_USER=apix_user
      - POSTGRES_PASSWORD=apix_secret
      - POSTGRES_DB=apix_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: apix-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
